<div [formGroup]="form">
  <mat-form-field>
    <input matInput placeholder="Course title" formControlName="title" />
    <mat-hint align="end">{{ ` ${courseTitle.value.length} / 60` }} </mat-hint>

    @if (courseTitle.errors?.titleExists) {
      <mat-error>This title is already being used</mat-error>
    }
  </mat-form-field>
  <mat-form-field>
    <input
      [matDatepicker]="releaseDatePicker"
      matInput
      placeholder="Release date"
      formControlName="releasedAt"
    />
    <mat-datepicker-toggle matSuffix [for]="releaseDatePicker"></mat-datepicker-toggle>
    <mat-datepicker #releaseDatePicker></mat-datepicker>
  </mat-form-field>

  <mat-checkbox color="primary" formControlName="downloadAvailable">
    Download available
  </mat-checkbox>

  <mat-form-field appearance="outline">
    <textarea placeholder="Description" matInput formControlName="longDescription"></textarea>
  </mat-form-field>
</div>
<p>
  {{ form.value | json }}
</p>
<p>
  {{ 'form.valid: ' + form.valid }}
</p>
